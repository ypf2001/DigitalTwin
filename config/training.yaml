# ============================================================
# SAC 训练超参
# ============================================================

sac:
  total_timesteps: 120000  # 总训练步数（环境交互步数）
  learning_rate: 3.0e-4    # 学习率，控制每次梯度更新的步幅
  buffer_size: 100000      # 经验回放缓冲区容量（最多存储多少条 transition）
  batch_size: 256          # 每次从缓冲区采样的批次大小
  learning_starts: 1000    # 开始学习前需先收集的随机探索步数（warm-up）
  tau: 0.005               # 目标网络软更新系数，τ 越小更新越平滑稳定
  gamma: 0.99              # 折扣因子，越接近 1 越重视远期回报
  ent_coef: auto           # 熵正则化系数，'auto' 表示自动调整以平衡探索与利用
  eval_freq: 2000          # 评估频率（步），每 N 步运行一次无噪声评估
  n_eval_episodes: 5       # 每次评估运行的 episode 数量，取平均作为评估指标
  log_interval: 4          # 日志输出间隔（步），控制训练过程信息的打印频率
  save_freq_div: 20        # 模型保存频率除数，每 total_timesteps/20 步保存一次中间模型
