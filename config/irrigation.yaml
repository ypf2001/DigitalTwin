# ============================================================
# 灌溉调度 & 季节仿真对比
# ============================================================

irrigation:
  emitters_per_ha: 37037   # 每公顷滴头数量
                           # 来源: 乌兰 (2022) 内蒙古农业大学硕士论文.
                           #        行距 0.9m × 株距 0.3m → 37037 株/ha，每株 1 滴头
  emitter_flow_lph: 2.2    # 单个滴头流量 (L/h)
                           # 来源: 乌兰 (2022) 内蒙古农业大学硕士论文.
                           #        内镶贴片式滴头，额定流量 2.2 L/h @ 0.1 MPa
  schedule:                # 固定灌溉排程: [天数, 生育期, 灌溉时间(分钟), EC目标(μS/cm)]
    - [5,   emergence,             225, 90]
    - [15,  emergence,             225, 90]
    - [24,  tuber_init,           225, 195]
    - [31,  tuber_init,           225, 195]
    - [38,  bulking,             225, 345]
    - [45,  bulking,             225, 345]
    - [55,  bulking,             225, 345]
    - [65,  starch_accumulation, 225, 195]
    # 灌溉排程来源: 乌兰 (2022) 内蒙古农业大学硕士论文, 表9.
    # T1=等量灌溉 225 m³/ha/次，T2=变量灌溉 90/90/195/195/345/345/345/195 m³/ha
    # 总灌溉量 1800 m³/ha (180 mm)，符合内蒙古马铃薯滴灌定额
    # 另见: 张富仓等 (2017) 农业工程学报 33(增刊1):1-8.
  rain_mm_day: 2.5         # 日均降雨量 (mm/天)
                           # 来源: 乌兰 (2022) 内蒙古农业大学硕士论文.
                           #        察右中旗马铃薯生育期 (5~9月) 有效降雨约 150~165 mm,
                           #        折合日均 2.3~2.7 mm/天
  area_ha: 0.1             # 灌溉面积 (公顷)
  dt_min: 15.0             # 时间步长 (分钟)
  initial_theta: null      # 初始土壤含水量，null 表示使用 soil.theta_init
  initial_ec: 0.1          # 初始土壤 EC (dS/m)
                           # 来源: 乌兰 (2022) 内蒙古农业大学硕士论文，播种前土壤背景值

# ---- 全生育期季节仿真对比 ----
season_comparison:
  area_ha: 0.1             # 灌溉面积 (公顷)
  dt_min: 15.0             # 时间步长 (分钟)
  ep_len_days: 90.0        # 全生育期 90 天
                           # 来源: 乌兰 (2022) 内蒙古农业大学硕士论文.
                           #        察右中旗马铃薯出苗至收获约 85~95 天
  et0_mm_day: 4.0          # 季节平均 ET0 (mm/天)
                           # 来源: 张富仓等 (2017) 农业工程学报 33(增刊1):1-8.
                           #        乌兰察布地区生育期平均 ET0=3.8~4.2 mm/天
  rain_mm_day: 2.5         # 日均降雨量 (mm/天)，同 irrigation.rain_mm_day
  seed: 42                 # 随机种子，固定以确保结果可复现
