# ============================================================
# 奖励函数参数
#
# B 方案奖励函数：
# r = -w1 * |EC_soil - target_ec|^2          根区 EC 接近马铃薯适宜 EC 参考的惩罚（二次型）
#     -w2 * |pH_drip - pH_set|^2            配液出口 pH 跟踪 SAC 给定 pH 目标的惩罚
#     -w_setpoint * |EC_drip - EC_set|^2    配液出口 EC 跟踪 SAC 给定 EC 目标的惩罚
#     -w3 * actuator_flow * flow_penalty_scale  执行流量/肥酸耗量惩罚
#     +w4 * max(0, 1 - actuator_flow / wue_norm) 执行效率奖励
#     +hard_penalty                         烧苗硬惩罚
#
# SAC 输出 EC_set/pH_set；q_f/q_a 由仿真执行层或 PLC-PID 计算。
# ============================================================

reward:
  w1: 4.0                  # 根区 EC 跟踪误差权重，算法调参值
  w2: 4.0                  # 配液出口 pH 目标跟踪误差权重，算法调参值
  w_setpoint: 1.0          # 配液出口 EC 跟踪 SAC 输出 EC_set 的权重，算法调参值
  w3: 0.1                  # 执行流量惩罚权重，算法调参值
  w4: 0.5                  # WUE/执行效率奖励权重，算法调参值
  flow_penalty_scale: 0.01 # 执行流量惩罚缩放系数，算法调参值
  wue_norm: 14.0           # 执行层 q_f+q_a 归一化基准流量 (L/min)，约等于 q_f_max+q_a_max

  pH_target: 6.0           # 固定策略/回退策略默认 pH 目标；B 方案训练时主要使用 SAC 输出 pH_set
                           # 来源: Westermann D.T. (2005) "Nutritional requirements of
                           #        potatoes." American Journal of Potato Research 82:301-307.
                           #        马铃薯养分吸收最适 pH 范围 5.5~6.5，取中值 6.0
                           # 另见: Sonneveld C. & Voogt W. (2009) "Plant Nutrition of
                           #        Greenhouse Crops." Springer, p.277.
                           #        滴灌施肥液推荐 pH 5.5~6.5

  ec_burn_threshold: 3.0   # 烧苗 EC 阈值 (dS/m)，土壤 EC 超过此值判定为盐害
                           # 来源: Maas E.V. & Hoffman G.J. (1977) "Crop salt tolerance—
                           #        current assessment." Journal of Irrigation and Drainage
                           #        Engineering 103(2):115-134.
                           #        马铃薯盐害阈值 ECe=1.7 dS/m（初始减产点），
                           #        50% 减产对应 ECe≈3.8 dS/m；取 3.0 dS/m 作为
                           #        强制终止的保守安全边界
                           # 另见: Levy D. & Veilleux R.E. (2007) "Adaptation of potato
                           #        to high temperatures and salinity—a review."
                           #        American Journal of Potato Research 84:487-506.
                           #        EC>3.0 dS/m 时叶片出现明显盐害症状

  ph_burn_threshold: 4.5   # 烧苗 pH 阈值，管道 pH 低于此值判定为酸烧苗
                           # 来源: Sonneveld C. & Voogt W. (2009) "Plant Nutrition of
                           #        Greenhouse Crops." Springer, p.277.
                           #        灌溉液 pH<4.5 时根系出现酸害，离子吸收受阻
                           # 另见: Marschner H. (1995) "Mineral Nutrition of Higher Plants."
                           #        2nd ed., Academic Press, London, p.461.
                           #        pH<4.5 导致 Al³⁺/Mn²⁺ 溶出，产生根系毒害

  hard_penalty: -100.0     # 烧苗惩罚值（大幅负奖励 + 强制终止回合）
