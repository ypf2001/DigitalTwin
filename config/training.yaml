# ============================================================
# SAC 训练超参
# ============================================================

sac:
  total_timesteps: 120000  # 总训练步数，算法设计值（基于收敛曲线经验判断）
  learning_rate: 3.0e-4    # 学习率
                           # 来源: Haarnoja T. et al. (2018) "Soft Actor-Critic:
                           #        Off-Policy Maximum Entropy Deep Reinforcement
                           #        Learning with a Stochastic Actor."
                           #        Proceedings of ICML 2018, PMLR 80:1861-1870.
                           #        原文推荐默认值 3×10⁻⁴
  buffer_size: 100000      # 经验回放缓冲区容量
                           # 来源: Haarnoja T. et al. (2018) ICML 2018.
                           #        原文连续控制任务标准配置 10⁵~10⁶
  batch_size: 256          # 每次采样批次大小
                           # 来源: Haarnoja T. et al. (2018) ICML 2018.
                           #        原文推荐 batch_size=256
  learning_starts: 1000    # 随机探索热身步数，算法设计值
  tau: 0.005               # 目标网络软更新系数
                           # 来源: Haarnoja T. et al. (2018) ICML 2018.
                           #        原文推荐 τ=0.005（polyak averaging）
  gamma: 0.99              # 折扣因子
                           # 来源: Sutton R.S. & Barto A.G. (2018) "Reinforcement
                           #        Learning: An Introduction." 2nd ed., MIT Press,
                           #        Cambridge, MA. Chapter 3.
                           #        连续控制任务标准值 γ=0.99
  ent_coef: auto           # 熵正则化系数自动调整
                           # 来源: Haarnoja T. et al. (2018) "Soft Actor-Critic
                           #        Algorithms and Applications." arXiv:1812.05905.
                           #        SAC-v2 引入自动温度调节，消除手动调参需求
  reward_scale: 0.1        # 奖励缩放因子，将原始奖励缩小以稳定训练
  eval_freq: 2000          # 评估频率（步），算法设计值
  n_eval_episodes: 5       # 每次评估 episode 数，算法设计值
  log_interval: 4          # 日志输出间隔，算法设计值
  save_freq_div: 20        # 模型保存频率除数，算法设计值
