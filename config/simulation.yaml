env:
  area_ha: 0.1
  dt_min: 5.0
  ep_len_days: 5.0
  et0_mm_day: 5.0
  obs_noise_std: 0.01
  q_w: 136.0
  seed: null
  theta_fc: 0.32
  theta_wp: 0.04
water_pump:
  # The SAC action remains [EC_set, pH_set]. Irrigation scheduling owns this
  # slower command; the pump model supplies the dynamic carrier-water flow.
  mode: flow                 # flow | pressure
  enabled_on_reset: true
  q_set_l_min: 136.0
  q_min_l_min: 0.0
  q_max_l_min: 180.0
  safe_flow_min_l_min: 20.0
  pressure_set_bar: 1.8
  rated_pressure_bar: 2.5
  response_tau_min: 0.5
  ramp_up_l_min_min: 300.0
  ramp_down_l_min_min: 400.0
  target_volume_l: 0.0       # 0 disables automatic volume completion
  # A nonzero Water_Volume_SP is a complete irrigation batch. These two
  # clean-water sections are included in the event total, not added on top.
  pre_flush_ratio: 0.10
  post_flush_ratio: 0.20
experiment:
  short_dt_min: 5.0      # 短期仿真实验步长 (分钟)。用于解析 pipe.tau=8 min 的管道延迟，不影响 SAC 默认训练步长
  season_dt_min: 5.0     # 季节对比实验步长 (分钟)。用于 T1/T2 仿真导出更平滑的曲线，不作为训练默认步长
day_night:
  night_start: 18.0
  night_end: 6.0
  day_start: 6.0
  day_end: 18.0
  daytime_hours: 12.0
  et_peak_factor: 2.0
  et_fluctuation: 0.15
soil:
  theta_sat: 0.42
  theta_fc: 0.334
  theta_wp: 0.09
  theta_init: 0.2
  ec_soil_init: 0.15
  K_sat: 15.3
  beta: 2.0
  root_depth_default: 300
  dispersivity_cm: 5.0          # 河套灌区耕地/盐荒地初始弥散度，用于水盐运移或 Fluent 物质输运初值
  molecular_diffusion_cm2_d: 0.7 # 河套灌区耕地/盐荒地分子扩散系数，Fluent 中需换算为 m2/s
mixing_tank:
  volume: 100.0
  ec_conc: 35.0          # 肥料母液 EC (dS/m)，当前作为高浓度复配肥液的等效参数
  ph_acid: 3.9           # 预稀释酸液 pH。使约 1 L/min 注酸流量落在可控制范围，避免强酸微小流量导致 pH 骤降
  ph_water: 7.2          # 清水 pH
pipe:
  tau: 8.0
  T: 3.5
action:
  # B 方案 SAC 动作空间：上层水肥目标值，不直接输出泵阀流量
  ec_set_min: 0.8        # SAC 输出滴灌/混肥出口目标 EC 下限 (dS/m)
  ec_set_max: 2.5        # SAC 输出滴灌/混肥出口目标 EC 上限 (dS/m)
  ph_set_min: 5.8        # SAC 输出滴灌/混肥出口目标 pH 下限
  ph_set_max: 6.8        # SAC 输出滴灌/混肥出口目标 pH 上限

  # 执行层限幅：纯仿真由 SetpointToFlowController 使用；真实部署由 PLC-PID 使用
  q_f_min: 0.0
  q_f_max: 10.0
  q_a_min: 0.0
  q_a_max: 4.0

  # 固定目标策略 [EC_set, pH_set]，用于无 SAC 对比或模型缺失回退
  fixed_strategy:
  - 1.5                  # 固定策略目标 EC_set (dS/m)，接近块茎膨大期目标
  - 6.0                  # 固定策略目标 pH_set
